<h2 id="apocalipse-71-8">Apocalipse 7.1-8</h2>
<p>O mundo recusará reconhecer que os desastres do cinco primeiros selos são julgamentos divinos, apesar dos avisos dos crentes de que eles são.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

}
;" data-marpit-pagination-total="130">
<p>Os eventos do sexto selo, porém, serão tão terríveis que todos terão de reconhecê-los como julgamento de Deus.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

;" data-marpit-pagination-total="130">
<p>Em meio ao seu terror, e às tentativas falhas de se esconderem da terrível presença do Pai e do Cordeiro, as pessoas clamarão:</p>
<blockquote>
<p>Pois chegou o grande dia de sua ira, e quem poderá sobreviver?<br />
<strong>Apocalipse 6.17</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

;" data-marpit-pagination-total="130">
<p>O capítulo 7 abre um parêntesis entre o sexto e sétimo selos, para responder essa pergunta, introduzindo dois grupos que sobreviverão à fúria do julgamento divino.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

;" data-marpit-pagination-total="130">
<p>O primeiro grupo, descrito nos versos 1 à 8, são evangelistas judeus que serão preservados na terra.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

;" data-marpit-pagination-total="130">
<p>Eles sobreviverão o holocausto da ira divina desencadeado pelos julgamentos dos selos, das trombetas e das taças.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

;" data-marpit-pagination-total="130">
<p>Deus também os protegerá dos esforços do Anticristo e de seus capangas de destruir os crentes do Deus verdadeiro.</p>
</section>

<p>Tendo sobrevivido à guerras, fome, desastres naturais sem precedente, doenças, pecaminosidade desenfreada e perseguição salvagem da Tribulação, eles entrarão no reino milenar vivos.</p>

<p>O segundo grupo a escapar a fúria divina são aqueles que foram martirizados e por consequência, conduzidos ao descanso jubiloso no céu, onde serão preservados.</p>

<p>Após os terríveis eventos do sexto selo, e antes da abertura do sétimo selo no capítulo 8, o Espírito Santo providencia este capítulo como um interlúdio para que o leitor recobre o fôlego.</p>

<p>Também é um lembrete de que em meio à Sua ira, Deus lembrará de Sua misericórdia <em>(cf. Habacuque 3.2)</em>.</p>

<p>Deus concederá descanso a vocês, que são afligidos, e também a nós, na revelação do Senhor Jesus, quando ele vier do céu.<br />

<p>Davi triunfantemente exultou</p>
<blockquote>
<p>O SENHOR ouve os justos quando clamam por socorro; ele os livra de todas as suas angústias.<br />
O SENHOR está perto dos que têm o coração quebrantado e resgata os de espírito oprimido.<br />

<p>No <strong>Salmo 91.3-10</strong>, o salmita fala da promessa de Deus de preservar os fiéis</p>
<blockquote>
<p>Pois ele o livrará das armadilhas da vida e o protegerá de doenças mortais.<br />
Ele o cobrirá com as suas penas e o abrigará sob as suas asas; a sua fidelidade é armadura e proteção.<br />
Não tenha medo dos terrores da noite, nem da flecha que voa durante o dia.<br />
Não tema a praga que se aproxima na escuridão, nem a calamidade que devasta ao meio-dia.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

Basta abrir os olhos, e verá como são castigados os perversos.<br />
Se você se refugiar no SENHOR, se fizer do Altíssimo seu abrigo, nenhum mal o atingirá, nenhuma praga se aproximará de sua casa.</p>

<p>Malaquias descreve Deus confortando aqueles que temem ser destruídos pelos julgamentos do Dia do Senhor.</p>
<blockquote>
<p>Então aqueles que temiam o SENHOR falaram uns com os outros, e o SENHOR ouviu o que disseram. Na presença dele, foi escrito um livro memorial para registrar os nomes dos que o temiam e que sempre honravam seu nome.</p>

<blockquote>
<p>&quot;Eles serão meu povo&quot;, diz o SENHOR dos Exércitos. &quot;No dia em que eu agir, eles serão meu tesouro especial. Terei compaixão deles como o pai tem compaixão de seu filho obediente. Então vocês verão outra vez a diferença entre o justo e o mau, entre o que serve a Deus e o que não serve.&quot;<br />
Assim diz o SENHOR dos Exércitos: &quot;o dia do julgamento se aproxima e arde como uma fornalha. Naquele dia, serão queimados como palha os arrogantes e os perversos. Serão consumidos, desde as raízes até os ramos.<br />
Mas, para vocês que temem meu nome, o sol da justiça se levantará, trazendo cura em suas asas. E vocês sairão e saltarão de alegria, como bezerros soltos no pasto.&quot;</p>
</blockquote>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

;" data-marpit-pagination-total="130">
<p>Sua morte física não é, porém, resultado da ira de Deus <em>(1 Tessalonicenses 1.10; 5.9)</em> mais do que quando um crente morre hoje.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

;" data-marpit-pagination-total="130">
<p>Os julgamentos de Deus sobre o mundo e a perseguição do Anticristo são meios pelos quais Deus os conduz à Sua presença.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

" lang="en-US" class="invert" data-marpit-pagination="37" style="--class:invert;--paginate:true;--theme:gaia;--heading-divider:3;--style:section {

;" data-marpit-pagination-total="130">
<p>Muitos crentes, porém, não morrerão, mas sobreviverão para povoar o reino milenar.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

;" data-marpit-pagination-total="130">
<p>Jesus ensinou isso ao descrever o julgamento das ovelhas e dos bodes <em>(Mateus 25.31-46)</em>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

}
;" data-marpit-pagination-total="130">
<p>Os bodes (os descrentes) serão jogados no inferno <em>(41-46)</em>, mas às ovelhas (os salvos), Jesus diz</p>
<blockquote>
<p>Venham, vocês que são abençoados por meu Pai. Recebam como herança o reino que ele lhes preparou desde a criação do mundo.<br />
<strong>Mateus 25.34</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

;" data-marpit-pagination-total="130">
<p>Os crentes que estiverem vivos quando o Senhor Jesus voltar, viverão em Seu reino terreno.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

}
;" data-marpit-pagination-total="130">
<p>Muitos dos vivos que entrarão no reino milenar, serão gentios <em>(cf. Isaías 2.2ss; Miquéias 4.1-5; Zacarias 8.20-23)</em>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

}
" lang="en-US" class="invert" data-marpit-pagination="42" style="--class:invert;--paginate:true;--theme:gaia;--heading-divider:3;--style:section {

}

blockquote {
    font-size: 34px;
}
;" data-marpit-pagination-total="130">
<p>Mas a tribulação também será um tempo de salvação para a nação de Israel, sobre o qual os profetas falaram.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

}
" lang="en-US" class="invert" data-marpit-pagination="43" style="--class:invert;--paginate:true;--theme:gaia;--heading-divider:3;--style:section {

}

h1, h2, h3, h4, h5, h6 {

}

blockquote {
    font-size: 34px;
}
;" data-marpit-pagination-total="130">
<p>A descrição mais detalhada deste evento é encontrada na profecia de Zacarías:</p>
<blockquote>
<p>&quot;Então derramarei um espírito de graça e oração sobre a linhagem de Davi e os habitantes de Jerusalém. Olharão para aquele a quem transpassaram e chorarão por ele como quem chora a morte do filho único; lamentarão amargamente por ele, como quem lamente a perda do filho mais velho.<br />
Naquele dia, o pranto em Jerusalém será como o grande pranto por Hadade-Rimom no vale de Megido.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {

}

blockquote {
    font-size: 34px;
}
" lang="en-US" class="invert" data-marpit-pagination="44" style="--class:invert;--paginate:true;--theme:gaia;--heading-divider:3;--style:section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
;" data-marpit-pagination-total="130">
<blockquote>
<p>Todo o Israel chorará, cada família separadamente, os maridos longe das esposas. A família de Davi chorará separadamente, bem como a família de Natã, a família de Levi e a família de Simei.<br />
Cada uma das famílias sobreviventes de Judá chorará separadamente, os maridos longe das esposas.<br />
Naquele dia, uma fonte será aberta para a linhagem de Davi e para os habitantes de Jerusalém, uma fonte para purificá-los de todos os seus pecados e impurezas.&quot;<br />
[...]</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

}

}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
;" data-marpit-pagination-total="130">
<blockquote>
<p>&quot;Dois terços dos habitantes da terra serão feridos e morrerão&quot;, diz o SENHOR, &quot;mas restará um terço da terra.<br />
Farei essa terça parte passar pelo fogo e a purificarei. Eu a refinarei como se refina a prata e a purificarei como se purifica o ouro. Ela invocará meu nome, e eu lhe responderei. Direi: 'Este é meu povo', e ela dirá: 'O SENHOR é nosso Deus'.&quot;</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {

}

}
" lang="en-US" class="invert" data-marpit-pagination="46" style="--class:invert;--paginate:true;--theme:gaia;--heading-divider:3;--style:section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
;" data-marpit-pagination-total="130">
<p>Este o tempo do qual o apóstolo Paulo fala quando escreve <code>E assim todo o Israel será salvo. Como dizem as Escrituras: &quot;O libertador virá de Sião e afastará Israel da impiedade&quot;</code> <em>(Romanos 11.26).</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
" lang="en-US" class="invert" data-marpit-pagination="47" style="--class:invert;--paginate:true;--theme:gaia;--heading-divider:3;--style:section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
;" data-marpit-pagination-total="130">
<p>Apocalipse 7.1-8 introduz um grupo de sobreviventes, preservados no meio do vendaval da tribulação, que foram redimidos há pouco tempo mas, quando o ataque final da fúria chega, são separados para um serviço especial e são protegidos.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
" lang="en-US" class="invert" data-marpit-pagination="48" style="--class:invert;--paginate:true;--theme:gaia;--heading-divider:3;--style:section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
;" data-marpit-pagination-total="130">
<p>A visão de João deste grupo especial contem 3 características: ira contida, santos selados e israelitas identificados.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
" lang="en-US" class="invert" data-marpit-pagination="49" style="--class:invert;--paginate:true;--theme:gaia;--heading-divider:3;--style:section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
;" data-marpit-pagination-total="130">
<h2 id="ira-contida">Ira Contida</h2>
<blockquote>
<p><em>Depois disto, vi quatro anjos em pé nos quatro cantos da terra, conservando seguros os quatro ventos da terra, para que nenhum vento soprasse sobre a terra, nem sobre o mar, nem sobre árvore alguma.</em><br />
<strong>7.1</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
" lang="en-US" class="invert" data-marpit-pagination="50" style="--class:invert;--paginate:true;--theme:gaia;--heading-divider:3;--style:section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
;" data-marpit-pagination-total="130">
<p><strong>Depois disto, vi</strong> indica que uma nova visão está sendo introduzida <em>(cf. 4.1; 7.1, 9; 15.5; 18.1; 19.1, &quot;ouvi&quot;)</em>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
" lang="en-US" class="invert" data-marpit-pagination="51" style="--class:invert;--paginate:true;--theme:gaia;--heading-divider:3;--style:section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
;" data-marpit-pagination-total="130">
<p>O uso de <strong>depois disto</strong> na passagem significa que a visão do sexto selo encerrou e João está prestes a ver uma nova.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
" lang="en-US" class="invert" data-marpit-pagination="52" style="--class:invert;--paginate:true;--theme:gaia;--heading-divider:3;--style:section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
;" data-marpit-pagination-total="130">
<p>Também indica que a nova visão apresenta eventos que seguem o sexto selo cronologicamente.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
" lang="en-US" class="invert" data-marpit-pagination="53" style="--class:invert;--paginate:true;--theme:gaia;--heading-divider:3;--style:section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
;" data-marpit-pagination-total="130">
<p>A cena muda do julgamento dos perversos para a proteção especial dos justos.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
" lang="en-US" class="invert" data-marpit-pagination="54" style="--class:invert;--paginate:true;--theme:gaia;--heading-divider:3;--style:section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

<p>Eles são vistos <strong>em pé nos quatro cantos da terra, conservando seguros os quatro ventos da terra</strong> <em>(cf. Jeremias 49.36; Mateus 24.31)</em>.</p>

<p>Os céticos imaginam que a referência poética de João aos <strong>quatro cantos da terra</strong> se refere à uma noção primitiva de que a terra seja plana e quadrada.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

;" data-marpit-pagination-total="130">
<p>A frase se refere ao planeta terra designando os 4 pontos cardeais, norte, sul, leste e oeste, dos quais os <strong>quatro ventos</strong>, ou seja, todo vento, <strong>da terra</strong> é originado.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

;" data-marpit-pagination-total="130">
<p>De suas posições chave na terra, estes anjos poderosos garantem <strong>que nenhum vento soprasse sobre a terra, nem sobre o mar, nem sobre árvore alguma</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

;" data-marpit-pagination-total="130">
<p>Os quatro ventos são geralmente associados nas Escrituras com o julgamento de Deus <em>(cf. Jeremias 49.39; Daniel 7.2; Oséias 13.15)</em>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

<p>Durante o interlúdio descrito no capítulo 7, o julgamento será retido quando os anjos conservarem seguros os ventos.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

;" data-marpit-pagination-total="130">
<p>Não haverá vento, nem brisa, nem ondas na praia, nem movimento das núvens; tudo estará mortalmente imóvel.</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

<p>Será uma demonstração incrível de poder, onde apenas quatro anjos pararão os ventos, e o ciclo hidrológico de vida na terra.</p>

<blockquote>
<p><em>Vi outro anjo que subia do nascente do sol, tendo o selo do Deus vivo, e clamou em grande voz aos quatro anjos, aqueles aos quais fora dado fazer dano à terra e ao mar, dizendo: Não danifiqueis nem a terra, nem o mar, nem as árvores, até selarmos na fronte os servos de nosso Deus.</em><br />
<strong>7.2s</strong></p>
</blockquote>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

;" data-marpit-pagination-total="130">
<p>O anjo tinha com ele <strong>o selo do Deus vivo</strong>.</p>
</section>

<p><strong>Selo</strong>, <em>sphragis</em>, geralmente se refere à um anel de sinete.</p>

;" data-marpit-pagination-total="130">
<p>Reis e outros oficiais usavam tais anéis para selar documentos e outros items com cera, deste mgodo afirmando sua autenticidade e garantindo sua segurança <em>(cf. Gênesis 41.42; Ester 3.10; 8.2, 8; Daniel 6.17; Mateus 27.66)</em>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

}
;" data-marpit-pagination-total="130">
<p>Um <strong>selo</strong>, portanto, denota propriedade e proteção <em>(cf. João 6.27; 2 Coríntios 1.22; Efésios 1.13; 4.30)</em>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

blockquote {

;" data-marpit-pagination-total="130">
<p>Ao contrário dos selos usados por reis insignificantes, o selo carregado pelo anjo era do <strong>Deus vivo</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-marpit-scope-0Ic4Xdaz="" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

blockquote {

}
;" data-marpit-pagination-total="130">
<p>A Bíblia frequentemente identifica Deus como o Deus vivo <em>(cf. 4.9s; 10.6; 15.7; Deuteronômio 5.26; Josué 3.10; 1 Samuel 17.26; 2 Reis 19.4; Salmo 42.2; 84.2; Jeremias 10.10; 23.36; Daniel 6.20; Oséias 1.10; Mateus 16.16; Romanos 6.29; 2 Coríntios 3.3; 6.16; 1 Timóteo 3.15; 4.10; Hebreus 3.12; 9.14; 10.31; 12.22)</em>, para distinguí-lO dos ídolos mortos adorados pelos descrentes.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="83" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

blockquote {

}
;" data-marpit-pagination-total="130">
<p>Sua eternidade garante que Ele cumprirá toda Sua vontade.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

}

blockquote {

}
;" data-marpit-pagination-total="130">
<p>A principal deidade da tribulação, o Anticristo, selará seus seguidores <em>(13.16s; 14.9ss; 16.2; 19.20)</em>, e o Deus verdadeiro e vivo selará os Seus.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

;" data-marpit-pagination-total="130">
<p><strong>Apocalipse 14.1</strong></p>
<blockquote>
<p>Então vi o Cordeiro em pé no monte Sião, e com ele estavam os 144 mil que tinham o nome dele e o nome de seu Pai escritos na testa.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="86" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

}

blockquote {

}
;" data-marpit-pagination-total="130">
<p>No Antigo Testamento, Deus marcou Israel com sangue em suas portas e batentes para poupá-los quando matasse os primogênitos do Egito.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="87" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

blockquote {

}
" lang="en-US" class="invert" data-marpit-pagination="86" style="--class:invert;--paginate:true;--theme:gaia;--heading-divider:3;--style:section {

h1, h2, h3, h4, h5, h6 {

}

blockquote {
    font-size: 34px;
}
;" data-marpit-pagination-total="130">
<p>Ele marcou Raabe com um cordão escarlate para poupar ela e os seus de serem mortos.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="88" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

}
" lang="en-US" class="invert" data-marpit-pagination="87" style="--class:invert;--paginate:true;--theme:gaia;--heading-divider:3;--style:section {

}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
;" data-marpit-pagination-total="130">
<p>A passagem, porém, que mais se parece com esta de Apocalipse é <strong>Ezequiel 9.3-6</strong>.</p>
<blockquote>
<p>Então a glória do Deus de Israel se levantou do meio dos querubins, onde havia estado, e se moveu para a entrada do templo. O SENHOR chamou o homem vestido de linho que carregava o estojo com material de escrever e lhe disse: &quot;Ande pelas ruas de Jerusalém e ponha um sinal na testa de todos que choram e gemem por causa dos pecados detestáveis cometidos em sua cidade&quot;.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="89" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {

}

blockquote {
    font-size: 34px;
}
" lang="en-US" class="invert" data-marpit-pagination="88" style="--class:invert;--paginate:true;--theme:gaia;--heading-divider:3;--style:section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
;" data-marpit-pagination-total="130">
<blockquote>
<p>Em seguida, ouvi o SENHOR dizer aos homens: &quot;Sigam-no pela cidade e matem todos cuja testa não estiver marcada. Não mostrem compaixão nem tenham piedade!<br />
Matem todos: idosos e jovens, meninas, mulheres e crianças pequenas. Mas não toquem naqueles que tiverem o sinal. Comecem aqui mesmo, no templo!&quot;. E eles começaram pelos setenta líderes, na entreda do templo.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="90" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {

}

blockquote {
    font-size: 34px;
}
" lang="en-US" class="invert" data-marpit-pagination="89" style="--class:invert;--paginate:true;--theme:gaia;--heading-divider:3;--style:section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
;" data-marpit-pagination-total="130">
<p>Aqueles com a marca de Deus sobre eles seriam poupados da destruição vindoura de Jerusalém.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="91" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

}

blockquote {

}
" lang="en-US" class="invert" data-marpit-pagination="90" style="--class:invert;--paginate:true;--theme:gaia;--heading-divider:3;--style:section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {

}

blockquote {
    font-size: 34px;
}
;" data-marpit-pagination-total="130">
<p>De maneira similar, estes servos de Deus que o anjo marcará com o selo de Deus serão protegidos e preservados durante os julgamentos vindouros <em>(cf. 9.4)</em>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="92" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

}

blockquote {

}
" lang="en-US" class="invert" data-marpit-pagination="91" style="--class:invert;--paginate:true;--theme:gaia;--heading-divider:3;--style:section {

    text-align: left;
}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
;" data-marpit-pagination-total="130">
<p>O quinto anjo, autoritariamente, <strong>clamou em grande voz aos quatro anjos, aqueles aos quais fora dado fazer dano à terra e ao mar, dizendo: Não danifiqueis nem a terra, nem o mar, nem as árvores, até selarmos na fronte os servos de nosso Deus</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="93" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
" lang="en-US" class="invert" data-marpit-pagination="92" style="--class:invert;--paginate:true;--theme:gaia;--heading-divider:3;--style:section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
;" data-marpit-pagination-total="130">
<p>O <strong>dano</strong> ou a devastação que virá sobre a <strong>terra, o mar</strong> e as <strong>árvores</strong> ocorrerá quando os quatro anjos, repentinamente, soltarem o julgamento (simbolizado pelos ventos) que eles tem segurado.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="94" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
" lang="en-US" class="invert" data-marpit-pagination="93" style="--class:invert;--paginate:true;--theme:gaia;--heading-divider:3;--style:section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
;" data-marpit-pagination-total="130">
<p>Mas aquele julgamento (e as trombetas e as taças) tem que esperar até que os anjos tenham <strong>selado na fronte os servos de nosso Deus</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="95" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
" lang="en-US" class="invert" data-marpit-pagination="94" style="--class:invert;--paginate:true;--theme:gaia;--heading-divider:3;--style:section {
    font-size: 56px;
    align-content: center;

}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
;" data-marpit-pagination-total="130">
<p>O uso de <strong>servos</strong> indica que eles já foram redimidos.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="96" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {
    font-size: 56px;

}

h1, h2, h3, h4, h5, h6 {

}

blockquote {
    font-size: 34px;
}
" lang="en-US" class="invert" data-marpit-pagination="95" style="--class:invert;--paginate:true;--theme:gaia;--heading-divider:3;--style:section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
;" data-marpit-pagination-total="130">
<p>Eles teram permanecido fiéis a Deus e ao Senhor Jesus, e provavelmente terão pregado, poderosa e efetivamente, a Palavra de Deus no meio do caos dos primeiros seis selos.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="97" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

}
" lang="en-US" class="invert" data-marpit-pagination="96" style="--class:invert;--paginate:true;--theme:gaia;--heading-divider:3;--style:section {
    font-size: 56px;
    align-content: center;
    text-align: left;
}

h1, h2, h3, h4, h5, h6 {
    text-align: center;
}

blockquote {
    font-size: 34px;
}
;" data-marpit-pagination-total="130">
<p>A partir deste momento eles deverão ser protegidos para continuarem a pregação da Palavra de Deus e a verdade sobre Seu Filho Jesus Cristo durante os momentos mais severos.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="98" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

<p>Após o selamento ser completo, os julgamentos iniciarão, dos quais os selados serão poupados.</p>

<p>Apocalipse 14.1-5 descrevê-os como sendo moralmente puros, de caráter imaculado e devotos a Jesus Cristo.</p>

<p>Ele são os servos de Deus mais fiéis, leais, diligentes e santos, durante esses dias de trevas; eles são a elite.</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="101" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

<p>Eles são descritos como sendo &quot;comprados dentre os habitantes da terra como oferta especial a Deus e ao Cordeiro&quot; <em>(14.4)</em>.</p>

<p>Ele serão os mais efetivos missionários que o mundo já viu, e serão intrumentos na conversão de seus conterrâneos e das nações.</p>

<p>Estes crentes e evangelistas judeus são as primícias de Israel, a qual será redimida como nação antes da volta de Cristo <em>(Zacarias 12.10-13.1, 8s; Romanos 11.26)</em>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="105" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

<p>Os 144 mil não são todos os judeus crentes daquele momento, apenas um grupo seleto para proclamar o evangelho naqueles dias <em>(cf. 12.17; 14.1-5).</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="106" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

;" data-marpit-pagination-total="130">
<p>Apesar da declaração clara e inequívoca de que os <strong>144 mil</strong> que serão <strong>selados</strong> serão das <strong>tribos dos filhos de Israel</strong>, muitos persistem em identificá-los como sendo a igreja.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="107" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

;" data-marpit-pagination-total="130">
<p>Nenhum texto do NT ou nos escritos da igreja primitiva até o ano 160 identifica a igreja com Israel.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="108" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

<p>Também seria ridículo dividir a igreja em 12 tribos para coincidir com a listagem de Apocalipse 7.5-8.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="109" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

;" data-marpit-pagination-total="130">
<p>O termo <strong>Israel</strong> deve ser interpretado de acordo com seu uso normal no Antigo e Novo Testamento como referência à descendência física de Abraão, de Isaque e de Jacó.</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="110" data-class="invert" data-paginate="true" data-theme="gaia" data-heading-divider="3" data-style="section {

<p>O fato de 12 mil <strong>de cada tribo ser selado</strong> fala do propósito eletivo de Deus.</p>

<p>Embora os registros tribais tenham sido perdidos quando os romanos invadiram Jerusalém em 70 d.C., Deus sabe quem pertence à cada tribo.</p>

;" data-marpit-pagination-total="130">
<p>Essa passagem também ensina que as &quot;dez tribos perdidas&quot; do norte, de fato, nunca foram perdidas <em>(cf. 21.12; Mateus 19.28; Lucas 22.30; Tiago 1.1)</em>.</p>

" lang="en-US" class="invert" data-marpit-pagination="114" style="--class:invert;--paginate:true;--theme:gaia;--heading-divider:3;--style:section {

;" data-marpit-pagination-total="130">
<p>Ao invés, representantes das dez tribos do norte infiltraram e se misturaram com as duas tribos do sul <em>(cf. 2 Crônicas 30.1-11; 34.1-9)</em>, assim elas foram preservadas.</p>

<p>Primeiro, deve ser notado que não há um método padrão de listar as 12 tribos.</p>
